# Publish galabavamsi.github.io/portfolio as redirects to www.galabavamsi.com
name: Deploy static content to Pages

# The real site is served by Cloudflare at www.galabavamsi.com. This keeps old
# galabavamsi.github.io/portfolio/... links working by forwarding each one to the
# same path on the new domain (see .github/pages-redirect/build.py).
on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build redirect pages
        run: python3 .github/pages-redirect/build.py
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
