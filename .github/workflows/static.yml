# Deploy the static site to GitHub Pages (manual)
name: Deploy static content to Pages

# The site is served by Vercel at galabavamsi.com. GitHub Pages needs a public repo
# or GitHub Pro, so this workflow is manual-only; run it if Pages is re-enabled.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Stage site (experiments/ stays unpublished)
        run: |
          mkdir -p .site
          rsync -a --exclude '.site' --exclude '.git' --exclude 'experiments' --exclude 'node_modules' ./ .site/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
